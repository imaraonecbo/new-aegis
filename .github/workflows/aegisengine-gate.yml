name: AegisEngine Gate
on: [push,pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:{node-version:22,cache:npm}
      - run: npm install
      - run: npm run contract:compile
      - run: npm run contract:test
